{% extends "layout.html" %}
{% block topbar_title %}Modificar Operación #{{ venta.numero_operacion }}{% endblock %}

{% block topbar_actions %}
<a href="/historial" class="btn btn-secondary">Operaciones cargadas</a>
<a href="/ventas/ver/{{ venta.id }}" class="btn btn-secondary">Volver</a>
{% endblock %}

{% block content %}
<div style="max-width:820px; margin:0 auto;">
  {% if error %}
  <div style="padding:12px 16px; margin-bottom:18px; background:#FEF2F2; border:1px solid #FECACA; border-radius:8px; color:#B91C1C;">{{ error }}</div>
  {% endif %}

  <form method="POST" class="card" style="padding:24px; display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <div style="grid-column:span 2;">
      <label class="input-label">Cliente</label>
      <select name="cliente" class="input-field" required>
        {% for c in clientes %}
        <option value="{{ c.id }}" {% if c.id == venta.cliente_id %}selected{% endif %}>#{{ c.interno }} - {{ c.nombre }}{% if c.dni %} (DNI: {{ c.dni }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div style="grid-column:span 2;">
      <label class="input-label">Vehículo</label>
      <select name="vehiculo" id="vehiculo" class="input-field" required onchange="cargarPrecio()">
        {% for v in vehiculos %}
        <option value="{{ v.id }}" data-precio="{{ v.precio_venta or 0 }}" {% if v.id == venta.vehiculo_id %}selected{% endif %}>#{{ v.interno }} - {{ v.marca }} {{ v.version }} {{ v.año }} · {{ v.dominio }}</option>
        {% endfor %}
      </select>
    </div>

    <div style="grid-column:span 2; border-top:2px solid #E5E7EB; padding-top:16px;"><div class="input-label">Boleto de compra</div></div>
    <div><label class="input-label">Precio del Vehículo ($)</label><input name="precio_vehiculo" id="precio_vehiculo" type="number" min="0" step="0.01" class="input-field" value="{{ venta.precio_vehiculo or 0 }}" required oninput="calcular()"></div>
    <div><label class="input-label">Bonificaciones ($)</label><input name="bonificaciones" id="bonificaciones" type="number" min="0" step="0.01" class="input-field" value="{{ venta.bonificaciones or 0 }}" oninput="calcular()"></div>
    <div><label class="input-label">Total Vehículo ($)</label><input id="total_vehiculo" type="number" class="input-field" value="{{ venta.total_vehiculo or 0 }}" readonly></div>
    <div><label class="input-label">Gestoría ($)</label><input name="gestoria" id="gestoria" type="number" min="0" step="0.01" class="input-field" value="{{ venta.gestoria or 0 }}" oninput="calcular()"></div>
    <div style="grid-column:span 2;"><label class="input-label">Total Gral ($)</label><input id="total_general" type="number" class="input-field" value="{{ venta.total_general or venta.precio or 0 }}" readonly></div>

    <div style="grid-column:span 2; border-top:2px solid #E5E7EB; padding-top:16px;"><div class="input-label">Forma de pago</div></div>
    <div><label class="input-label">Seña ($)</label><input name="senia" id="senia" type="number" min="0" step="0.01" class="input-field" value="{{ venta.senia or 0 }}" oninput="calcular()"></div>
    <div><label class="input-label">Contado ($)</label><input name="contado" id="contado" type="number" min="0" step="0.01" class="input-field" value="{{ venta.entrega or 0 }}" oninput="calcular()"></div>
    <div style="grid-column:span 2;"><label class="input-label">Toma Usado ($)</label><input name="precio_toma" id="precio_toma" type="number" min="0" step="0.01" class="input-field" value="{{ venta.precio_toma or 0 }}" oninput="calcular()"><label style="display:flex; gap:8px; align-items:center; margin-top:8px; font-size:13px;"><input type="checkbox" name="toma_usado" id="toma_usado" {% if venta.toma_usado %}checked{% endif %} onchange="calcular()"> Recibe un vehículo usado</label></div>
    <div style="grid-column:span 2;"><label class="input-label">Descripción del usado</label><input name="detalle_toma_usado" id="detalle_toma_usado" class="input-field" value="{{ venta.detalle_toma_usado or '' }}" placeholder="Marca, modelo, año, dominio..."></div>
    <div><label class="input-label">Financiación Prendaria ($)</label><input name="financiado" id="financiado" type="number" min="0" step="0.01" class="input-field" value="{{ venta.monto_financiado or 0 }}" oninput="calcular()"></div>
    <div><label class="input-label">Entidad financiera</label><input name="banco" class="input-field" value="{{ venta.banco or '' }}"></div>
    <div style="grid-column:span 2;"><label class="input-label">Total ($)</label><input id="total_pago" type="number" class="input-field" readonly></div>

    <div style="grid-column:span 2; display:flex; justify-content:flex-end; gap:10px; margin-top:8px;">
      <a href="/ventas/ver/{{ venta.id }}" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </div>
  </form>
</div>

<script>
function cargarPrecio() {
  const option = document.querySelector('#vehiculo option:checked');
  document.getElementById('precio_vehiculo').value = option?.dataset.precio || 0;
  calcular();
}
function calcular() {
  const precio = parseFloat(document.getElementById('precio_vehiculo').value || 0);
  const bonificaciones = parseFloat(document.getElementById('bonificaciones').value || 0);
  const gestoria = parseFloat(document.getElementById('gestoria').value || 0);
  const totalVehiculo = precio - bonificaciones;
  document.getElementById('total_vehiculo').value = totalVehiculo.toFixed(2);
  document.getElementById('total_general').value = (totalVehiculo + gestoria).toFixed(2);
  const usado = document.getElementById('toma_usado').checked ? parseFloat(document.getElementById('precio_toma').value || 0) : 0;
  const totalPago = parseFloat(document.getElementById('senia').value || 0) + parseFloat(document.getElementById('contado').value || 0) + usado + parseFloat(document.getElementById('financiado').value || 0);
  document.getElementById('total_pago').value = totalPago.toFixed(2);
}
calcular();
</script>
{% endblock %}
