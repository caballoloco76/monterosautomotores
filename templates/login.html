<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monteros Automotores — Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0D0D0D;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* FONDO DECORATIVO */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(192,39,45,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(192,39,45,0.08) 0%, transparent 50%);
  }

  /* LÍNEAS DECORATIVAS */
  .lines {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .lines::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -10%;
    width: 120%;
    height: 200%;
    background: repeating-linear-gradient(
      75deg,
      transparent,
      transparent 60px,
      rgba(255,255,255,0.015) 60px,
      rgba(255,255,255,0.015) 61px
    );
  }

  /* PANEL */
  .login-panel {
    position: relative;
    z-index: 10;
    width: 400px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 44px 40px;
    backdrop-filter: blur(20px);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* ACENTO ROJO SUPERIOR */
  .login-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 40px; right: 40px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #C0272D, transparent);
    border-radius: 1px;
  }

  .logo-wrap {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-wrap img {
    max-width: 180px;
  }

  .form-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
    text-align: center;
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #E8E8E8;
    font-size: 14.5px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .field input:focus {
    border-color: #C0272D;
    box-shadow: 0 0 0 3px rgba(192,39,45,0.2);
  }

  .field input::placeholder { color: #555; }

  .btn-login {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    background: #C0272D;
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .btn-login:hover { background: #A01E23; }
  .btn-login:active { transform: scale(0.99); }

  .error-msg {
    background: rgba(192,39,45,0.15);
    border: 1px solid rgba(192,39,45,0.4);
    border-radius: 7px;
    padding: 10px 14px;
    color: #F87171;
    font-size: 13px;
    margin-bottom: 18px;
    text-align: center;
  }

  .footer-text {
    text-align: center;
    margin-top: 28px;
    font-size: 11px;
    color: #444;
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px) {
    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
      padding: 16px 0;
    }

    .login-panel {
      width: calc(100% - 32px);
      max-width: 400px;
      padding: 36px 24px;
    }

    .logo-wrap { margin-bottom: 28px; }
    .logo-wrap img { max-width: 160px; }
    .field input { font-size: 16px; }
  }
</style>
</head>

<body>
<div class="lines"></div>

<div class="login-panel">
  <div class="logo-wrap">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Monteros Automotores">
  </div>

  <div class="form-title">Acceso al sistema</div>

  {% if error %}
  <div class="error-msg">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Usuario</label>
      <input name="username" type="text" placeholder="Ingresá tu usuario" autocomplete="username" required>
    </div>

    <div class="field">
      <label>Contraseña</label>
      <input name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn-login">Ingresar</button>
  </form>

  <div class="footer-text">Monteros Automotores · Sistema de Gestión</div>
</div>

</body>
</html>
